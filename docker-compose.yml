services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: mplad, POSTGRES_USER: mplad, POSTGRES_PASSWORD: mplad}
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U mplad"], interval: 5s, timeout: 5s, retries: 5}
  ai-ml:
    build: {context: ., dockerfile: ai-ml/Dockerfile}
    ports: ["8001:8001"]
  backend:
    build: {context: ., dockerfile: backend/Dockerfile}
    command: sh -c "python -m app.db.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      JWT_SECRET: ${JWT_SECRET}
      ML_SERVICE_URL: ${ML_SERVICE_URL}
    ports: ["8000:8000"]
    depends_on: {db: {condition: service_healthy}, ai-ml: {condition: service_started}}
  frontend:
    build: {context: ., dockerfile: frontend/Dockerfile}
    environment: {VITE_API_URL: http://localhost:8000}
    ports: ["5173:5173"]
    depends_on: {backend: {condition: service_started}}
