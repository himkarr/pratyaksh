name: CI
on: [pull_request]
jobs:
  backend: {runs-on: ubuntu-latest, steps: [{uses: actions/checkout@v4}, {uses: actions/setup-python@v5, with: {python-version: '3.12'}}, {run: 'pip install -r backend/requirements.txt && pytest backend/tests'}]}
  ai_ml: {runs-on: ubuntu-latest, steps: [{uses: actions/checkout@v4}, {uses: actions/setup-python@v5, with: {python-version: '3.12'}}, {run: 'pip install -r ai-ml/requirements.txt && cd ai-ml && pytest'}]}
  frontend: {runs-on: ubuntu-latest, steps: [{uses: actions/checkout@v4}, {uses: actions/setup-node@v4, with: {node-version: '24'}}, {run: 'cd frontend && npm ci && npm run build'}]}
